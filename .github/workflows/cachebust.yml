name: Cache-bust assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp asset versions with commit SHA
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/style.css?v=[0-9a-zA-Z-]*/style.css?v=$V/; s/script.js?v=[0-9a-zA-Z-]*/script.js?v=$V/" index.html
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: cache-bust assets for $GITHUB_SHA" --no-verify
            git push
          fi
